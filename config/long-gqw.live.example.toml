# The GqWfqfG6 unit's config (Nov 24, the owner: live at 0.5 SOL on the main long wallet; check command `uuu`). From
# analysis/research/2026-11-20/tape_screen/out_w3/GqWfqfG6_setup.txt: every buy of 0.5+ SOL, any coin, tp 3x, 420 s,
# stall 240, no sell pressure, its sale never; its SOL coins on the same exit (sol_exits = false). +20.5% a copy, positive
# in 4 of 4 blocks; passes both pick versions; 1.00x. The seven units skip each other's coins (other_state_dirs).
# For a new box: sudo install -m 0640 -o root -g rugsnipe config/long-gqw.live.example.toml /etc/rugsnipe/long-gqw.toml.
# /etc/rugsnipe/long.toml: the long copy (rugsnipe-long, docs/20).
# Copy H9kuqGKN's 1.5-SOL buys of pump coins priced in other tokens; hold up to 30 minutes.
# The gRPC feed and the senders come from the hot unit's config (hot_config) and api-keys.

# log = paper (live curve, nothing sent); on = real buys from the long wallet; off = nothing.
mode = "on"

copy_wallet = "GqWfqfG6Mt6RL8BKUWiBkirqzycUc15bgZVtFERQzxJ8"

# its buy valued in SOL: its 1.5-SOL tier (reads 1.45-1.51 by route)
min_sol = 0.5
# our buy, valued in SOL (1.0 tested: at 0.5 the fixed costs eat the edge)
stake_sol = 1.0
# the curve price against the price its buy left, without our own tokens
take_profit = 3.0
# 0 = no stop (the trip ends at the take profit or the hold). Since Nov 2026 wallet 4 sells most coins early and
# the 0.8 stop sold into its sale: Oct 29 - Nov 4, 1 SOL x 3, +1.79 with 0.8, +6.26 with none; neutral on Oct 19-28
# (analysis/research/2026-10-31/since_stop)
stop = 0.0
# it sells at 1800 s after its buy
max_hold_s = 420
# positions open at once: each takes stake_sol (grid.py cap, P1 Oct 19-22 / P2 Oct 23-27: 1 open +2.6 / +3.5,
# 2 +6.5 / +8.1, 3 +5.0 / +9.6, 4 +6.7 / +11.1, 5 +6.7 / +10.9 SOL; the wallet itself: a median 2 of these open, max 11)
max_open = 2
# our buy refused when the price before our fill is more than this over the price its buy left (the
# backtest's limit; our own impact is not part of it)
max_premium = 0.5
# no new buys once today's (UTC) realized result is at or below -daily_stop_sol
daily_stop_sol = 2.0

# held as floats besides wrapped SOL: routes may start and end in them (WBTC carried Oct 23-27).
# Buy one with: rugsnipe-long float buy 3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh 3.0
floats = ["3NZ9JMVBmGAqocybic2c7LQCJScmgsAZ6vQqTDzcqmJh", "pumpCmXqMfrsAkQ5r49WcJnRayYRqmXz6ae8H7H9Dfn", "SPCXxcqXj6e5dJDVNovHN8744zkbhM2bYudU45BimGb", "TTWofwAge91oFhZs7kpQdyrVRkmevgM88xijGvQFbKo", "he1iusmfkpAdwvxLNGV8Y1iSbj4rUy6yMhEA3fotn9A", "98kfF7rmsg1QDUEoCqNE7g7M1FdrTt92TEp2CLzypump", "Xsc9qvGR1efVDFGLrVsmkzv3qi45LTBjeUKSPmx9qEh", "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"]

# chain reads and sendTransaction: a line of the api-keys file (never the URL with its key here)
rpc_url = "cred:RPC_URL"
hot_config = "/etc/rugsnipe/rugsnipe.toml"
api_keys = "/etc/rugsnipe/keys/api-keys.toml"
wallet_file = "/etc/rugsnipe/keys/long-wallet.json"

# one buy sender (two landing would double the position); sells to these (empty = all enabled)
buy_senders = ["nozomi"]
sell_senders = ["nozomi"]
rpc_send = true
buy_tip_lamports = 1000000
sell_tip_lamports = 1000000
# micro-lamports per compute unit (300k units: 2,000,000 = 0.0006 SOL)
buy_cu_price = 2000000
sell_cu_price = 1000000
cu_limit = 350000
# sell min_out under the expected output: take profit, then stop / time / its sell. The floor drops only after
# sells that landed and failed (2 landed failures: half; 4: almost any price), never after send errors
sell_slack_tp = 0.15
sell_slack_exit = 0.30
# a sell that keeps failing: 3 tries at once, then 5 s, 30 s, 2 min apart; past this much in failed-sell
# fees on one position, every 10 min (never given up)
max_sell_fail_sol = 0.01
# paper: a buy fills on the curve at the end of this many slots after the slot we saw its buy in; a paper sell the
# same way after the trade that fired the exit
paper_land_slots = 1
# SOL kept in the wallet beyond the stakes (fees, rent): a wSOL buy needs stake_sol + reserve_sol
reserve_sol = 0.05
# sell right behind its own early sell (the backtest's rule). false: keep our own exits and record what selling
# behind it would have made (2026-10-28: it sells early on half of its big buys now; Oct 27-28 holding to our exits
# scored +3.10 against -0.51 behind it, Oct 19-27 about even). Paper-test it before a real run.
follow_its_sell = false
# with follow_its_sell = false: still sell behind its sale when it comes [from, to) seconds after its buy while the price
# is under follow_early_below x the price its buy left (an early sale of a coin that has not taken off); [] = off.
# Oct 29 - Nov 12: [30, 180] and 1.5 better in both weeks (analysis/research/2026-10-31/since_stop/follow_when.py)
follow_early_s = []
follow_early_below = 1.5
# our buy when the route starts from a float (WBTC); 0 = stake_sol. WBTC-routed copies made about +0.12 SOL a copy
# against +0.02 from wrapped SOL (2 SOL on WBTC / 1 on wSOL: P1 +8.13, P2 +25.07 against +5.44 / +12.79)
float_stake_sol = 0.0
# a float holding less than the stake (a loss is paid back in it) still buys, with all it holds, when that is at
# least this share of the stake; 1.0 = the whole stake or nothing. 0.5 with several small floats (PUMP, SPCX).
float_min_frac = 0.5
# skip a coin whose fee tier (protocol + creator fee of its own buy, basis points) is under this; 0 = off. 125 skips
# the coins priced in another coin with a creator fee of 1% or less (analysis/research/2026-11-15/skip_filters/).
min_fee_bps = 0
# exit signals (analysis/research/2026-11-16/signals/): out when the other traders' sells outnumber their buys by n
# over w seconds, from `from` s after its buy ([n, w, from]; [] = off; live from Nov 15: [5, 60, 30]); and when the
# price has made no new high for stall_s seconds once back at our fill price (0 = off; live from Nov 15: 180).
sell_pressure = []
stall_s = 240

# other units trading from this same wallet (their state dirs): a coin one of them holds is not bought, and a sale
# never closes a coin account one of them still uses (Nov 18: rugsnipe-long and rugsnipe-long-tab on one wallet)
other_state_dirs = ["/var/lib/rugsnipe-long", "/var/lib/rugsnipe-long-cq", "/var/lib/rugsnipe-long-cgy", "/var/lib/rugsnipe-long-3xe", "/var/lib/rugsnipe-long-6lw", "/var/lib/rugsnipe-long-6nn", "/var/lib/rugsnipe-long-fat", "/var/lib/rugsnipe-long-htk", "/var/lib/rugsnipe-long-3si", "/var/lib/rugsnipe-long-bng", "/var/lib/rugsnipe-long-e2x", "/var/lib/rugsnipe-long-e5c", "/var/lib/rugsnipe-long-2gj"]
# Nov 25: buy its coin even when another unit holds it (two of our wallets agree: +16.7% a copy against +10.8% alone;
# analysis/research/2026-11-25/consensus/); both units hold it, the shared account stays open while either does
join_others = true
# its SOL-priced coins too (Nov 22: on all its buys, blind, SOL coins +8.4% a copy on 125, token coins +26.2% on 76)
copy_sol_coins = true
# its SOL coins with their own exits (Nov 22: on its blind blocks, SOL coins tp 2x / 120 s +11.06 SOL on 124, positive in
# all three, against tp 3x / 420 s / stall 240 +10.90 with one losing; its token coins keep tp 3x / 420 s / stall 240)
sol_exits = false
sol_take_profit = 2.0
sol_max_hold_s = 120
sol_stall_s = 0
sol_sell_pressure = []
# pay only with a float: no route from wrapped SOL (a coin reached only through a SOL pool is skipped)
float_only = false
# the dip leg (docs/20 §3, "the split"; Nov 19): dip_drop > 0 and dip_stake_sol > 0 = leg 2 on the same buy of its,
# bought at the first trade of a later slot at or under (1 - dip_drop) x the price its buy left within dip_within_s,
# sold at dip_take_profit x our fill or after dip_max_hold_s, nothing else. 0 = off (one leg, as before).
dip_drop = 0.0
dip_within_s = 60
dip_stake_sol = 0.0
dip_take_profit = 1.5
dip_max_hold_s = 900
# the dip leg only when our route pays with a float (m15f: float-paid +15.9% a trade, wSOL-paid +3.1% and negative its
# last 2 weeks); the copy leg keeps paying with wSOL and floats
dip_float_only = false
state_dir = "/var/lib/rugsnipe-long-gqw"
price_api = "https://lite-api.jup.ag/price/v3"
