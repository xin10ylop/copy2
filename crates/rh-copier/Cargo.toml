[package]
name = "rh-copier"
version = "0.1.0"
description = "rh-copier: copies chosen traders' buys on Robinhood Chain's Pons launchpad (an EVM chain, chain 4663) on the coins' own bonding curves, with the exits engineered per trader (analysis/research/2026-11-18/robinhood/). Its own wallet, process and state."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rh-copier"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1.53", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "ring", "std", "tls12"] }   # both engines, as the workspace build unifies them
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
alloy-primitives = "1"
alloy-consensus = { version = "1", features = ["k256"] }
alloy-signer = "1"
alloy-signer-local = "1"
alloy-eips = "1"
alloy-network = "1"
zeroize = "1.9"

[lints.clippy]
too_many_arguments = "allow"
